# Builds the Docker image (all GPU architectures) and publishes it as ghcr.io/<owner>/skinhash.
# Runs when the sources change on main, for version tags (v1.2.3), and by hand (Actions tab -> Docker -> Run).
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "*.c"
      - "*.cu"
      - "*.cuh"
      - "*.h"
      - "*.py"
      - "build.sh"
      - "Dockerfile"
      - ".dockerignore"
      - "skins/steve.png"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # the CUDA devel build stage needs ~10 GB; the runner image comes with tools this job never uses
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/skinhash
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the compile stage is cached between runs, so a change to the Python files alone rebuilds in a minute
          cache-from: type=gha
          cache-to: type=gha,mode=max
