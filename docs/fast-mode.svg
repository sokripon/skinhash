<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="940" height="470" rx="12" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#1d1d1f">Fast mode: why each candidate costs only a few SHA-256 blocks</text>

  <text x="24" y="70" font-size="13.5" font-weight="600" fill="#1d1d1f">1. Shuffle a fixed set of byte values in the last 6 (transparent) pixels</text>
  <text x="24" y="90" font-size="12.5" fill="#555">The values appear nowhere else in the image, so zlib can't find a match through them: every tail byte is encoded as a literal.</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" text-anchor="middle">
    <g transform="translate(24,104)">
      <rect width="138" height="26" rx="5" fill="#fdecec" stroke="#e5484d"/><text x="69" y="17">a3 17 c9  α=00</text>
      <rect x="146" width="138" height="26" rx="5" fill="#fdecec" stroke="#e5484d"/><text x="215" y="17">5e f1 2b  α=00</text>
      <rect x="292" width="138" height="26" rx="5" fill="#fdecec" stroke="#e5484d"/><text x="361" y="17">d4 08 9a  α=00</text>
      <text x="456" y="17" fill="#666">…</text>
    </g>
    <text x="556" y="121" fill="#666" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">→ next candidate →</text>
    <g transform="translate(626,104)">
      <rect width="138" height="26" rx="5" fill="#fdecec" stroke="#e5484d"/><text x="69" y="17">2b a3 f1  α=00</text>
      <rect x="146" width="138" height="26" rx="5" fill="#fdecec" stroke="#e5484d"/><text x="215" y="17">9a 17 5e  α=00</text>
    </g>
  </g>

  <text x="24" y="166" font-size="13.5" font-weight="600" fill="#1d1d1f">2. Same values in a different order = same symbol frequencies = same Huffman tables</text>
  <text x="24" y="186" font-size="12.5" fill="#555">So the compressed size, the IDAT length and every bit before the tail are identical for every candidate.</text>

  <text x="24" y="226" font-size="13.5" font-weight="600" fill="#1d1d1f">3. The PNG file: almost everything is fixed</text>
  <g font-size="11.5" text-anchor="middle" fill="#1d1d1f">
    <rect x="24" y="242" width="40" height="40" fill="#e6e6e3" stroke="#999"/><text x="44" y="266">sig</text>
    <rect x="64" y="242" width="50" height="40" fill="#e6e6e3" stroke="#999"/><text x="89" y="266">IHDR</text>
    <rect x="114" y="242" width="104" height="40" fill="#eef3fb" stroke="#8aa2c8"/><text x="166" y="259">zlib header +</text><text x="166" y="274">Huffman tables</text>
    <rect x="218" y="242" width="492" height="40" fill="#eef3fb" stroke="#8aa2c8"/><text x="464" y="259">compressed pixels: identical for every candidate</text><text x="464" y="274" fill="#555">(including the watermark)</text>
    <rect x="710" y="242" width="96" height="40" fill="#fdecec" stroke="#e5484d"/><text x="758" y="259">tail literals</text><text x="758" y="274">+ end-of-block</text>
    <rect x="806" y="242" width="56" height="40" fill="#fdecec" stroke="#e5484d"/><text x="834" y="259">Adler-32</text><text x="834" y="274">CRC-32</text>
    <rect x="862" y="242" width="54" height="40" fill="#e6e6e3" stroke="#999"/><text x="889" y="266">IEND</text>
  </g>
  <text x="24" y="302" font-size="11.5" fill="#555">About 3.5 KB in total; only the last ~50 bytes (red) change from one candidate to the next.</text>

  <text x="24" y="340" font-size="13.5" font-weight="600" fill="#1d1d1f">4. SHA-256 works in 64-byte blocks, so the fixed part is hashed once</text>
  <g font-size="11.5" text-anchor="middle" fill="#1d1d1f">
    <rect x="24" y="356" width="686" height="34" rx="4" fill="#eef3fb" stroke="#8aa2c8"/>
    <text x="367" y="377">~55 blocks, hashed ONCE at start-up → saved "midstate"</text>
    <rect x="710" y="356" width="104" height="34" rx="4" fill="#fdecec" stroke="#e5484d"/><text x="762" y="377">last block(s)</text>
    <rect x="814" y="356" width="102" height="34" rx="4" fill="#fdecec" stroke="#e5484d" stroke-dasharray="4 3"/><text x="865" y="377">padding</text>
  </g>
  <text x="24" y="416" font-size="12.5" fill="#555">Per candidate: re-pack ~24 literal codes, update Adler-32 and CRC-32, finish SHA-256 from the midstate (1–2 blocks).</text>
  <text x="24" y="436" font-size="12.5" fill="#555">No compression in the loop. A self-test checks 1000 random candidates against real zlib, and every hit is rebuilt and checked again.</text>
  <text x="24" y="456" font-size="12.5" fill="#555">That's what makes the CPU fast path ~300× faster than full re-compression, and what makes the GPU version possible.</text>
</svg>
