<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="940" height="300" rx="12" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#1d1d1f">How Mojang turns a skin into a texture link</text>
  <text x="24" y="56" font-size="12.5" fill="#555">Mojang re-encodes every upload, so only the pixels matter. Checked byte for byte against real uploads.</text>

  <g font-size="12.5" text-anchor="middle">
    <rect x="24" y="84" width="130" height="92" rx="10" fill="#eef3fb" stroke="#8aa2c8"/>
    <text x="89" y="112" font-weight="600" fill="#1d1d1f">Skin pixels</text>
    <text x="89" y="132" fill="#444">64×64 RGBA</text>
    <text x="89" y="150" fill="#444">incl. hidden RGB</text>
    <text x="89" y="166" fill="#444">under alpha 0</text>

    <rect x="178" y="84" width="130" height="92" rx="10" fill="#eef3fb" stroke="#8aa2c8"/>
    <text x="243" y="112" font-weight="600" fill="#1d1d1f">Scanlines</text>
    <text x="243" y="132" fill="#444">64 rows × 257 B</text>
    <text x="243" y="150" fill="#444">each row starts</text>
    <text x="243" y="166" fill="#444">with filter byte 0</text>

    <rect x="332" y="84" width="140" height="92" rx="10" fill="#eef3fb" stroke="#8aa2c8"/>
    <text x="402" y="112" font-weight="600" fill="#1d1d1f">zlib deflate</text>
    <text x="402" y="132" fill="#444">level 4, wbits 15</text>
    <text x="402" y="150" fill="#444">memLevel 8</text>
    <text x="402" y="166" fill="#444">default strategy</text>

    <rect x="496" y="84" width="150" height="92" rx="10" fill="#eef3fb" stroke="#8aa2c8"/>
    <text x="571" y="112" font-weight="600" fill="#1d1d1f">PNG file</text>
    <text x="571" y="132" fill="#444">signature + IHDR</text>
    <text x="571" y="150" fill="#444">+ ONE IDAT + IEND</text>
    <text x="571" y="166" fill="#444">no other chunks</text>

    <rect x="670" y="84" width="110" height="92" rx="10" fill="#fdf1e2" stroke="#f0a030"/>
    <text x="725" y="112" font-weight="600" fill="#1d1d1f">SHA-256</text>
    <text x="725" y="132" fill="#444">of the whole</text>
    <text x="725" y="150" fill="#444">file</text>

    <rect x="804" y="84" width="112" height="92" rx="10" fill="#fdecec" stroke="#e5484d"/>
    <text x="860" y="112" font-weight="600" fill="#1d1d1f">Texture id</text>
    <text x="860" y="132" fill="#444">hex, leading</text>
    <text x="860" y="150" fill="#444">zeros dropped</text>
  </g>
  <g stroke="#666" stroke-width="1.6" marker-end="url(#ar)">
    <line x1="154" y1="130" x2="176" y2="130"/>
    <line x1="308" y1="130" x2="330" y2="130"/>
    <line x1="472" y1="130" x2="494" y2="130"/>
    <line x1="646" y1="130" x2="668" y2="130"/>
    <line x1="780" y1="130" x2="802" y2="130"/>
  </g>

  <rect x="24" y="200" width="892" height="80" rx="10" fill="#f7f7f5"/>
  <text x="44" y="226" font-size="12.5" fill="#555">SHA-256</text>
  <text x="120" y="226" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#1d1d1f"><tspan fill="#e5484d" font-weight="700">00000000000</tspan>ce81796dbeb618dd6f893689e6f05a98faea679edba3bfda50315</text>
  <text x="44" y="258" font-size="12.5" fill="#555">Link</text>
  <text x="120" y="258" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#1d1d1f">textures.minecraft.net/texture/ce81796dbeb618dd6f893689e6f05a98faea679edba3bfda50315</text>
  <text x="896" y="226" font-size="11.5" text-anchor="end" fill="#c0282d">11 zeros</text>
  <text x="896" y="258" font-size="11.5" text-anchor="end" fill="#c0282d">53-char id</text>
</svg>
