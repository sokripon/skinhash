<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="940" height="300" rx="12" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#1d1d1f">Search speed (measured on Ryzen 5 5600X / RTX 5060 Ti)</text>
  <text x="24" y="56" font-size="12.5" fill="#555">Candidates per second, log scale. Right column: average time to find 10 leading zeros (≈1.1 trillion tries).</text>

  <!-- log axis: 1e5 at x=210, each decade = 105 px; 1e10 at x=735 -->
  <g stroke="#e3e3e0" stroke-width="1">
    <line x1="210" y1="76" x2="210" y2="240"/><line x1="315" y1="76" x2="315" y2="240"/>
    <line x1="420" y1="76" x2="420" y2="240"/><line x1="525" y1="76" x2="525" y2="240"/>
    <line x1="630" y1="76" x2="630" y2="240"/><line x1="735" y1="76" x2="735" y2="240"/>
  </g>
  <g font-size="11" fill="#777" text-anchor="middle">
    <text x="210" y="258">100k</text><text x="315" y="258">1M</text><text x="420" y="258">10M</text>
    <text x="525" y="258">100M</text><text x="630" y="258">1G</text><text x="735" y="258">10G</text>
  </g>

  <g font-size="13">
    <text x="24" y="104" font-weight="600" fill="#1d1d1f">Generic (CPU)</text>
    <text x="24" y="120" font-size="11" fill="#777">full zlib per candidate</text>
    <rect x="210" y="92" width="24" height="24" rx="4" fill="#8aa2c8"/>
    <text x="242" y="109" fill="#1d1d1f">170 k/s</text>
    <text x="916" y="109" text-anchor="end" fill="#1d1d1f">~75 days</text>

    <text x="24" y="156" font-weight="600" fill="#1d1d1f">Fast mode (CPU)</text>
    <text x="24" y="172" font-size="11" fill="#777">12 threads, SHA-NI</text>
    <rect x="210" y="144" width="276" height="24" rx="4" fill="#c9b6e8"/>
    <text x="494" y="161" fill="#1d1d1f">43 M/s</text>
    <text x="916" y="161" text-anchor="end" fill="#1d1d1f">~7 hours</text>

    <text x="24" y="208" font-weight="600" fill="#1d1d1f">Fast mode (GPU)</text>
    <text x="24" y="224" font-size="11" fill="#777">CUDA, RTX 5060 Ti</text>
    <rect x="210" y="196" width="430" height="24" rx="4" fill="#e5484d"/>
    <text x="648" y="213" fill="#1d1d1f">1.25 G/s</text>
    <text x="916" y="213" text-anchor="end" fill="#1d1d1f">~15 minutes</text>
  </g>
  <text x="24" y="286" font-size="11.5" fill="#777">Each extra leading zero takes 16× longer on average. The current record (11 zeros) was a lucky find well ahead of the ~4 h average.</text>
</svg>
